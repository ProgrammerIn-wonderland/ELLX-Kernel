name: Build qcom-x1e kernel packages

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-qcom-x1e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build qcom-x1e Debian packages on arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show runner details
        run: |
          uname -a
          lscpu
          df -h

      - name: Free disk space for the kernel package build
        run: |
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            bc \
            bindgen \
            bison \
            bpftool \
            clang-19 \
            cpio \
            curl \
            debhelper \
            default-jdk-headless \
            dkms \
            fakeroot \
            flex \
            gawk \
            java-common \
            kmod \
            libaudit-dev \
            libbpf-dev \
            libcap-dev \
            libdebuginfod-dev \
            libdw-dev \
            libelf-dev \
            libiberty-dev \
            liblzma-dev \
            libnewt-dev \
            libnl-3-dev \
            libnl-genl-3-dev \
            libnuma-dev \
            libpci-dev \
            libssl-dev \
            libstdc++-dev \
            libtool \
            libtraceevent-dev \
            libtracefs-dev \
            libudev-dev \
            libunwind-dev \
            llvm-19-dev \
            openssl \
            pahole \
            pkg-config \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            rust-src \
            rustc \
            rustfmt \
            systemd-ukify \
            uuid-dev \
            zstd

      - name: Prepare resolute qcom-x1e packaging metadata
        run: |
          export DEB_BUILD_OPTIONS="parallel=$(nproc)"
          fakeroot ./debian/rules clean
          ./debian/rules updateconfigs

      - name: Build resolute qcom-x1e kernel packages
        run: |
          export DEB_BUILD_OPTIONS="parallel=$(nproc)"
          fakeroot ./debian/rules binary-qcom-x1e

      - name: Upload qcom-x1e packages
        uses: actions/upload-artifact@v4
        with:
          name: qcom-x1e-kernel-packages-arm64
          if-no-files-found: error
          path: |
            ../*.deb
            ../*.changes
            ../*.buildinfo
